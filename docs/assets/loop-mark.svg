<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">Loop mark</title>
  <desc id="desc">Two connected arcs forming a continuous feedback loop.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4285F4"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <style>
      .arc{fill:none;stroke:url(#g);stroke-width:13;stroke-linecap:round;stroke-dasharray:145 55;transform-origin:90px 90px;animation:turn 8s linear infinite}
      .arc.alt{stroke:#34A853;stroke-dasharray:90 110;animation-duration:11s;animation-direction:reverse}
      @keyframes turn{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.arc{animation:none}}
    </style>
  </defs>
  <circle cx="90" cy="90" r="59" class="arc"/>
  <circle cx="90" cy="90" r="40" class="arc alt" opacity=".9"/>
  <circle cx="90" cy="90" r="8" fill="#202124"/>
</svg>
