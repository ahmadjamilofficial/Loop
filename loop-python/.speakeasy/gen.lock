examples:
  health:
    speakeasy-default-health:
      responses:
        "200":
          application/json: {"status": "ok", "version": "0.1.0"}
  log_interaction:
    speakeasy-default-log-interaction:
      requestBody:
        application/json: {"prompt": "<value>", "response": "<value>"}
      responses:
        "201":
          application/json: {"id": "<id>", "timestamp": "2025-06-25T16:57:53.407Z", "stored": false}
        "422":
          application/json: {"error": {"type": "<value>", "message": "<value>", "request_id": "<id>"}}
  log_interactions_batch:
    speakeasy-default-log-interactions-batch:
      requestBody:
        application/json: {"interactions": []}
      responses:
        "201":
          application/json: {"ids": ["<value 1>", "<value 2>", "<value 3>"], "count": 756973, "stored": false}
        "422":
          application/json: {"error": {"type": "<value>", "message": "<value>", "request_id": "<id>"}}
  submit_feedback:
    thumbs_up:
      requestBody:
        application/json: {"interaction_id": "int_a1b2c3d4", "rating": "up"}
      responses:
        "201":
          application/json: {"id": "<id>", "interaction_id": "<id>", "rating": "up", "has_correction": true, "stored": false}
        "422":
          application/json: {"error": {"type": "<value>", "message": "<value>", "request_id": "<id>"}}
    thumbs_down_with_correction:
      requestBody:
        application/json: {"interaction_id": "int_a1b2c3d4", "rating": "down", "correction": "The capital of Pakistan is Islamabad.", "comment": "Response was missing context."}
      responses:
        "201":
          application/json: {"id": "<id>", "interaction_id": "<id>", "rating": "up", "has_correction": true, "stored": false}
        "422":
          application/json: {"error": {"type": "<value>", "message": "<value>", "request_id": "<id>"}}
    speakeasy-default-submit-feedback:
      requestBody:
        application/json: {"interaction_id": "<id>", "rating": "down"}
      responses:
        "201":
          application/json: {"id": "<id>", "interaction_id": "<id>", "rating": "up", "has_correction": true, "stored": false}
        "422":
          application/json: {"error": {"type": "<value>", "message": "<value>", "request_id": "<id>"}}
  export_formats:
    speakeasy-default-export-formats:
      responses:
        "200":
          application/json: {"formats": [{"format": "dpo_jsonl", "description": "from pivot chasuble", "schema_example": {"key": "<value>", "key1": "<value>"}}]}
  echo_stats:
    speakeasy-default-echo-stats:
      requestBody:
        application/json: {"total_interactions": 138347, "total_feedback": 924831, "thumbs_up": 135135, "thumbs_down": 283587, "with_correction": 145343, "without_correction": 80840}
      responses:
        "200":
          application/json: {"total_interactions": 51603, "total_feedback": 323874, "thumbs_up": 591734, "thumbs_down": 850826, "with_correction": 532996, "without_correction": 807788}
        "422":
          application/json: {"error": {"type": "<value>", "message": "<value>", "request_id": "<id>"}}
examplesVersion: 1.0.2
